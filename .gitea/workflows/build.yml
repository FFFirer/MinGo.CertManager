name: Build and Release

on:
  release:
    types: [ published, prereleased, released ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/mingocertmanager:${{ env.VERSION }}
            ${{ vars.DOCKER_REGISTRY }}/mingocertmanager:latest

      - name: Test Docker image
        run: docker run --rm ${{ vars.DOCKER_REGISTRY }}/mingocertmanager:latest dotnet test

