receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Traces → stdout (development)
  # 替换为 jaeger 或 otlp 后端用于生产环境
  debug:
    verbosity: basic

  # Metrics → Prometheus (Collector 内置 /metrics 端点)
  prometheus:
    endpoint: 0.0.0.0:8888
    namespace: certmanager

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

  extensions: []
  telemetry:
    logs:
      level: info
