version: '3.8'

services:
  certmanager:
    build: .
    image: 1mingo/certmanager:dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - Acme__UseStaging=false
      - Acme__AccountEmail=your-email@example.com
      - AliyunDns__AccessKeyId=your-access-key-id
      - AliyunDns__AccessKeySecret=your-access-key-secret
    volumes:
      - ./data:/app/data
    restart: unless-stopped
